apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.linkerd.io/stable
    targetRevision: 1.16.11
    chart: linkerd-control-plane
    helm:
      values: |
        controller:
          replicas: 1
        destination:
          replicas: 1
        identity:
          replicas: 1
          issuer:
            scheme: kubernetes.io/tls
        proxyInjector:
          replicas: 1
        profileValidator:
          replicas: 1
        spValidator:
          replicas: 1
        policyController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
