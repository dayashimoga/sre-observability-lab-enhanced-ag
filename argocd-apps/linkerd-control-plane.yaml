apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.linkerd.io/stable
    targetRevision: 1.16.11
    chart: linkerd-control-plane
    helm:
      values: |
        identityTrustAnchorsPEM: |
          # Self-signed CA generated by Linkerd CLI or cert-manager is usually required.
          # For this lab, we rely on the chart generating self-signed certs if empty, or we need to provide valid PEM.
          # The upstream chart documentation states: "If not provided, Helm will generate a self-signed CA."
        identity:
          issuer:
            scheme: kubernetes.io/tls
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
