
replicaCount: 2

image:
  repository: docker.io/library/nginx
  pullPolicy: IfNotPresent
  tag: "alpine" 

podAnnotations:
  linkerd.io/inject: enabled

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: demo.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  # PRODUCTION GRADE: Enable Horizontal Pod Autoscaling (HPA).
  # This automatically scales the number of pods based on CPU utilization.
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

resources:
  # PRODUCTION GRADE: Define Resources Requests and Limits.
  # Requests guarantee resources for the pod.
  # Limits prevent the pod from starving neighbors.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

canary:
  enabled: true
  weight: 90
